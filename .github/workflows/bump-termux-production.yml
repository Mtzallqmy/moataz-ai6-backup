name: Bump Termux Production Dependency

on:
  push:
    branches:
      - agent/production-android-hardening
    paths:
      - .github/workflows/bump-termux-production.yml

permissions:
  contents: write

jobs:
  bump:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: agent/production-android-hardening
          fetch-depth: 0
      - name: Bump Termux terminal libraries
        shell: bash
        run: |
          set -euo pipefail
          grep -F 'termux = "0.118.0"' gradle/libs.versions.toml
          sed -i 's/termux = "0.118.0"/termux = "0.118.3"/' gradle/libs.versions.toml
          git diff --check
      - name: Commit
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add gradle/libs.versions.toml
          git commit -m "update Termux terminal libraries to 0.118.3"
          git push origin HEAD:agent/production-android-hardening

name: Android Release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to create, e.g. v0.1.0"
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: android-release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    env:
      MOATAZ_KEYSTORE_BASE64: ${{ secrets.MOATAZ_KEYSTORE_BASE64 }}
      MOATAZ_KEYSTORE_PASSWORD: ${{ secrets.MOATAZ_KEYSTORE_PASSWORD }}
      MOATAZ_KEY_ALIAS: ${{ secrets.MOATAZ_KEY_ALIAS }}
      MOATAZ_KEY_PASSWORD: ${{ secrets.MOATAZ_KEY_PASSWORD }}
      GH_TOKEN: ${{ github.token }}

    steps:
      - name: Resolve version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          TAG="${{ inputs.tag || github.ref_name }}"
          case "$TAG" in
            v[0-9]*.[0-9]*.[0-9]*) ;;
            *) echo "Invalid release tag: $TAG" >&2; exit 1 ;;
          esac
          VERSION_NAME="${TAG#v}"
          IFS='.' read -r MAJOR MINOR PATCH <<< "$VERSION_NAME"
          if ! [[ "$MAJOR" =~ ^[0-9]+$ && "$MINOR" =~ ^[0-9]+$ && "$PATCH" =~ ^[0-9]+$ ]]; then
            echo "Tag must be a plain semantic version such as v0.1.0" >&2
            exit 1
          fi
          if (( MINOR >= 1000 || PATCH >= 1000 )); then
            echo "minor and patch components must be below 1000 for Android versionCode mapping" >&2
            exit 1
          fi
          VERSION_CODE=$((10#$MAJOR * 1000000 + 10#$MINOR * 1000 + 10#$PATCH))
          if (( VERSION_CODE < 1 || VERSION_CODE > 2100000000 )); then
            echo "Calculated Android versionCode is out of range: $VERSION_CODE" >&2
            exit 1
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "name=$VERSION_NAME" >> "$GITHUB_OUTPUT"
          echo "code=$VERSION_CODE" >> "$GITHUB_OUTPUT"

      - name: Checkout source
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event_name == 'push' && github.ref_name || 'main' }}
          submodules: recursive
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK tools
        uses: android-actions/setup-android@v4

      - name: Install Android SDK packages
        shell: bash
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager --channel=3 \
            "platform-tools" \
            "platforms;android-37.0" \
            "build-tools;36.0.0" \
            "cmake;3.22.1" \
            "ndk;28.2.13676358"

      - name: Set up Gradle cache
        uses: gradle/actions/setup-gradle@v6

      - name: Set up Node.js 24
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          package-manager-cache: false

      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10
          run_install: false

      - name: Install Web UI dependencies
        working-directory: web-ui
        run: pnpm install --frozen-lockfile

      - name: Web UI typecheck
        working-directory: web-ui
        run: pnpm run typecheck

      - name: Configure production signing
        shell: bash
        run: |
          set -euo pipefail
          missing=()
          for name in \
            MOATAZ_KEYSTORE_BASE64 \
            MOATAZ_KEYSTORE_PASSWORD \
            MOATAZ_KEY_ALIAS \
            MOATAZ_KEY_PASSWORD; do
            [[ -n "${!name:-}" ]] || missing+=("$name")
          done

          if (( ${#missing[@]} > 0 )); then
            printf 'Production release blocked: missing GitHub Actions secret(s): %s\n' "${missing[*]}" >&2
            echo "A tagged/manual production release must use one stable signing key. Temporary CI signing is intentionally disabled." >&2
            exit 1
          fi

          mkdir -p .ci
          if ! printf '%s' "$MOATAZ_KEYSTORE_BASE64" | base64 --decode > .ci/moataz-release.jks; then
            echo "MOATAZ_KEYSTORE_BASE64 is not valid base64." >&2
            exit 1
          fi
          [[ -s .ci/moataz-release.jks ]] || { echo "Decoded production keystore is empty." >&2; exit 1; }

          keytool -list \
            -keystore .ci/moataz-release.jks \
            -storepass "$MOATAZ_KEYSTORE_PASSWORD" \
            -alias "$MOATAZ_KEY_ALIAS" >/dev/null

          {
            printf 'storeFile=%s\n' "$GITHUB_WORKSPACE/.ci/moataz-release.jks"
            printf 'storePassword=%s\n' "$MOATAZ_KEYSTORE_PASSWORD"
            printf 'keyAlias=%s\n' "$MOATAZ_KEY_ALIAS"
            printf 'keyPassword=%s\n' "$MOATAZ_KEY_PASSWORD"
          } > local.properties
          chmod 600 .ci/moataz-release.jks local.properties

      - name: Unit tests and release lint
        shell: bash
        run: |
          set -euo pipefail
          ./gradlew --no-daemon --stacktrace \
            :ai:testDebugUnitTest \
            :app:testDebugUnitTest \
            :app:lintRelease

      - name: Build signed release APK and AAB
        run: >-
          ./gradlew --no-daemon --stacktrace
          -PMOATAZ_VERSION_NAME=${{ steps.version.outputs.name }}
          -PMOATAZ_VERSION_CODE=${{ steps.version.outputs.code }}
          :app:assembleRelease
          :app:bundleRelease

      - name: Prepare and verify production artifacts
        id: assets
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release-artifacts

          APK="$(find app/build/outputs/apk/release -type f -name '*arm64-v8a*.apk' ! -name '*unsigned*' -print -quit)"
          [[ -n "$APK" ]] || {
            echo "Signed arm64-v8a release APK not found." >&2
            find app/build/outputs/apk/release -maxdepth 2 -type f -print || true
            exit 1
          }

          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose --print-certs "$APK"
          "$ANDROID_HOME/build-tools/36.0.0/zipalign" -c -v 4 "$APK"

          BADGING="$("$ANDROID_HOME/build-tools/36.0.0/aapt" dump badging "$APK")"
          printf '%s\n' "$BADGING" | grep -F "package: name='ai.moataz'" >/dev/null || {
            echo "Unexpected applicationId in release APK." >&2
            printf '%s\n' "$BADGING" | grep -E "^package:" || true
            exit 1
          }
          printf '%s\n' "$BADGING" | grep -F "sdkVersion:'26'" >/dev/null || {
            echo "Release does not declare minSdk 26 (Android 8.0)." >&2
            printf '%s\n' "$BADGING" | grep -E 'sdkVersion|targetSdkVersion' || true
            exit 1
          }
          printf '%s\n' "$BADGING" | grep -F "targetSdkVersion:'37'" >/dev/null || {
            echo "Release does not declare targetSdk 37." >&2
            printf '%s\n' "$BADGING" | grep -E 'sdkVersion|targetSdkVersion' || true
            exit 1
          }

          unzip -l "$APK" | grep -q 'lib/arm64-v8a/' || {
            echo "arm64 native libraries are missing." >&2
            exit 1
          }
          if unzip -l "$APK" | grep -q 'lib/x86_64/'; then
            echo "x86_64 libraries unexpectedly present in the direct-download arm64 APK." >&2
            exit 1
          fi

          AAB="$(find app/build/outputs/bundle/release -type f -name '*.aab' -print -quit)"
          [[ -n "$AAB" ]] || { echo "Signed release AAB not found." >&2; exit 1; }

          FINAL_APK="release-artifacts/moataz-ai-${{ steps.version.outputs.tag }}-android8-arm64.apk"
          FINAL_AAB="release-artifacts/moataz-ai-${{ steps.version.outputs.tag }}.aab"
          cp "$APK" "$FINAL_APK"
          cp "$AAB" "$FINAL_AAB"

          sha256sum "$FINAL_APK" > "$FINAL_APK.sha256"
          sha256sum "$FINAL_AAB" > "$FINAL_AAB.sha256"
          echo "apk=$FINAL_APK" >> "$GITHUB_OUTPUT"
          echo "aab=$FINAL_AAB" >> "$GITHUB_OUTPUT"

      - name: Upload workflow artifacts
        uses: actions/upload-artifact@v7
        with:
          name: moataz-ai-${{ steps.version.outputs.tag }}-production
          path: release-artifacts/*
          if-no-files-found: error
          retention-days: 30

      - name: Create or update GitHub Release
        shell: bash
        run: |
          set -euo pipefail
          TAG="${{ steps.version.outputs.tag }}"
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            if [[ "${{ github.event_name }}" == "push" ]]; then
              gh release create "$TAG" \
                --verify-tag \
                --title "Moataz AI $TAG" \
                --notes "Production-signed Moataz AI for Android 8.0+ (minSdk 26). Direct-download APK is arm64-v8a; AAB is included for store distribution."
            else
              gh release create "$TAG" \
                --target main \
                --title "Moataz AI $TAG" \
                --notes "Production-signed Moataz AI for Android 8.0+ (minSdk 26). Direct-download APK is arm64-v8a; AAB is included for store distribution."
            fi
          fi
          gh release upload "$TAG" release-artifacts/* --clobber

      - name: Clean signing material
        if: always()
        run: rm -rf .ci local.properties
